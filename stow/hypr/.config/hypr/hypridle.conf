general {
    lock_cmd = caelestia shell lock             # Bloquea la pantalla mediante Caelestia Shell
    before_sleep_cmd = loginctl lock-session    # Bloquea antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Enciende la pantalla al despertar
}

# Baja el brillo al 10% tras 2.5 minutos de inactividad
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Bloquea la pantalla tras 5 minutos
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apaga el monitor tras 5.5 minutos
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspende el equipo tras 30 minutos
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}