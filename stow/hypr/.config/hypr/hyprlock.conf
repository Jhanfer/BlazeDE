general {
    hide_cursor = true
}

# Fondo: tu imagen de escritorio con desenfoque
background {
    monitor =
    path = ~/Pictures/tu_fondo.jpg # <-- CAMBIA ESTA RUTA
    blur_passes = 2
    blur_size = 7
}

# Reloj grande en la parte superior
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 100
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Campo de entrada de contraseña
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}