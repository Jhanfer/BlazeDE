# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Transparencia y color de fondo MORADO OSCURO
background_opacity 0.40
# 0.0 = totalmente transparente, 1.0 = opaco
background #4A0479
# Para que el fondo morado se mezcle con el blur de hyprland
dynamic_background_opacity yes

# Colores del texto
# Colores básicos
foreground            #FFFFFF  # Texto normal BLANCO
background            #4A0479  # Fondo (ya definido)
selection_foreground  #FFFFFF  # Texto seleccionado
selection_background  #4A2379  # Fondo de selección (morado más claro)

# Colores Negro (16 colores estándar)
color0  #2E2E2E  # Negro
color8  #555555  # Negro brillante

# Colores Rojo (para errores)
color1  #FF3333  # Rojo
color9  #FF6666  # Rojo brillante

# Colores Verde
color2  #7AD87A  # Verde
color10 #9AE69A  # Verde brillante

# Colores Amarillo
color3  #FFD966  # Amarillo
color11 #FFE699  # Amarillo brillante

# Colores Azul
color4  #6B8CFF  # Azul
color12 #9AB0FF  # Azul brillante

# Colores Magenta / Morado OSCURO (para resaltar)
color5  #8A4FFF  # Morado oscuro
color13 #B088FF  # Morado brillante

# Colores Cyan
color6  #5FD7D7  # Cyan
color14 #8AE6E6  # Cyan brillante

# Colores Blanco
color7  #F0F0F0  # Blanco
color15 #FFFFFF  # Blanco brillante

# Cursor
cursor              #FFFFFF  # Cursor blanco
cursor_text_color   #000000  # Texto del cursor negro (para contraste)

# Colores específicos para URLs y subrayado
url_color           #8A4FFF  # URLs en morado oscuro
underline_color     #8A4FFF  # Subrayado en morado oscuro

# Colores para el indicador (prompt) de shell
shell_integration  enabled

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use zsh ALWAYS
shell zsh

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
remember_window_size no